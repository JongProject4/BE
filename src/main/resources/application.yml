spring:
  profiles:
    include: gemini,oauth
  datasource:
    url: jdbc:mysql://localhost:3306/aikids_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${DB_PASSWORD:wlals0298*}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: "gemini-2.5-flash"
    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:18000}

app:
  voice-stream:
    tts-enabled: true
    use-sync-llm: false
    # true: 쉼표(，,)에서도 TTS 큐 (응답 지연 단축, 문장 중간 끊김 가능)
    tts-split-on-comma: true
    min-tts-chars: 8
  gemini:
    log-raw-sse: true
    stream-model: ${GEMINI_STREAM_MODEL:gemini-2.5-flash}
    tts-model: ${GEMINI_TTS_MODEL:gemini-2.5-flash-preview-tts}
    voice-name: ${GEMINI_VOICE_NAME:Kore}
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:1024}
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-key-change-this-at-least-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  oauth2:
    frontend-redirect-uri: ${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:3000/}
  stt:
    credentials-path: ${GOOGLE_STT_CREDENTIALS_PATH:keys/ai-kids-care-guide-b1211d7af27f.json}