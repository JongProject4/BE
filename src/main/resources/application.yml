spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 543142626935-6vc6c2gqu8npnlpbtcltm5ea21i7d9qq.apps.googleusercontent.com
            client-secret: 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
